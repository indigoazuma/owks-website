<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お問い合わせ｜株式会社OWKS</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="site-header"><a class="logo" href="">株式会社OWKS</a><button class="menu-button" aria-label="メニュー" aria-expanded="false"><span></span><span></span><span></span></button><nav class="global-nav"><a href="product.html">製品詳細</a><a href="simulation.html">シミュレーション</a><a href="faq.html">FAQ</a><a href="company.html">会社概要</a><a class="nav-contact" href="contact.html">お問い合わせ</a></nav></header>
<main><section class="page-hero"><div class="container"><p class="eyebrow">CONTACT</p><h1>お問い合わせ</h1><p>● 製品に関するご質問や導入のご相談など、お気軽にお問い合わせください。<br>● 以下のフォームよりお問い合わせください。</p></div></section>
<section class="page-content"><div class="container"><form class="contact-form"><div class="form-row"><label for="company">会社名</label><input id="company" name="company"></div><div class="form-row"><label for="name">お名前 <span class="required">必須</span></label><input id="name" name="name" required></div><div class="form-row"><label for="kana">お名前（フリガナ）</label><input id="kana" name="kana"></div><div class="form-row"><label for="tel">電話番号</label><input id="tel" name="tel" type="tel"></div><div class="form-row"><label for="email">メールアドレス <span class="required">必須</span></label><input id="email" name="email" type="email" required></div><div class="form-row"><label for="message">内容 <span class="required">必須</span></label><textarea id="message" name="message" required></textarea></div><div class="submit-row"><button class="button" type="submit">送信</button></div><p class="form-note">内容を確認のうえ、担当者よりご連絡いたします。<br>お問い合わせ内容によっては、ご返信までにお時間をいただく場合がございます。</p><p class="form-message" role="status"></p></form></div></section></main><div data-footer></div><script defer src="/main.js"></script></body></html>
